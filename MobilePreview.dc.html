<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<sc-if value="{{ on }}" hint-placeholder-val="{{ false }}">
  <div style="position:fixed; inset:0; z-index:1000; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:24px; background:#e9e8e4;">
    <div style="width:410px; max-width:100%; height:min(864px, calc(100vh - 84px)); padding:10px; border-radius:54px; background:#0f1013; box-shadow:0 40px 80px -30px rgba(15,16,19,.45);">
      <iframe data-mobile-frame="1" src="{{ src }}" title="Mobile preview" style="display:block; width:100%; height:100%; border:0; border-radius:44px; background:#f6f5f2;"></iframe>
    </div>
    <span style="font-family:'Geist Mono',monospace; font-size:12px; color:#55575e;">Mobile · 390 px</span>
  </div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:120,&quot;height&quot;:120},&quot;viewport&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Desktop&quot;,&quot;Mobile&quot;],&quot;default&quot;:&quot;Desktop&quot;,&quot;tsType&quot;:&quot;'Desktop' | 'Mobile'&quot;}}">
class Component extends DCLogic {
  inFrame() {
    if (/[?&]frame=mobile/.test(location.search)) return true;
    try { return !!(window.frameElement && window.frameElement.hasAttribute('data-mobile-frame')); } catch (e) { return false; }
  }
  on() { return this.props.viewport === 'Mobile' && !this.inFrame(); }
  sync() {
    document.body.style.overflow = this.on() ? 'hidden' : '';
    if (this.inFrame()) document.documentElement.style.scrollbarWidth = 'none';
  }
  componentDidMount() { this.sync(); }
  componentDidUpdate() { this.sync(); }
  componentWillUnmount() { document.body.style.overflow = ''; }
  renderVals() {
    const on = this.on();
    let src = '';
    if (on) { const u = new URL(location.href); u.searchParams.set('frame', 'mobile'); u.hash = ''; src = u.toString(); }
    return { on, src };
  }
}
</script>
</body>
</html>
